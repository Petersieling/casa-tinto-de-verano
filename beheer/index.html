<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Beheer | Casa Tinto de Verano</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Albert+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --paper: #FDFAF5; --panel: #F7EFE0; --ink: #3A2315; --muted: #7B6552; --gold: #B98A2E; --gold-text: #8A6016;
  --gold-soft: #F3DDB0; --line: #E6D8BE; --orange: #D6731B; --ok: #2F6B3C; --ok-soft: #DDEBD9; --stop: #9B2C1F; --grey: #CFC6B8;
  --display: "Cormorant Garamond", Georgia, serif; --body: "Albert Sans", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 1rem/1.5 var(--body); }
h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.15; margin: 0; }
h1 { font-size: 1.9rem; } h2 { font-size: 1.6rem; } h3 { font-size: 1.25rem; }
a { color: var(--gold-text); }
.wrap { max-width: 72rem; margin-inline: auto; padding-inline: clamp(1rem, 3vw, 2rem); }
button, .knop { font: inherit; cursor: pointer; background: var(--ink); color: var(--paper); border: 1px solid var(--ink); border-radius: 999px; padding: .45rem 1rem; text-decoration: none; display: inline-block; }
button:hover, .knop:hover { background: var(--gold-text); border-color: var(--gold-text); }
button.licht, .knop.licht { background: transparent; color: var(--ink); }
button.licht:hover, .knop.licht:hover { background: var(--ink); color: var(--paper); }
button.rood { background: transparent; color: var(--stop); border-color: var(--stop); }
button.rood:hover { background: var(--stop); color: var(--paper); }
button.klein, .knop.klein { padding: .25rem .7rem; font-size: .875rem; }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
input, select, textarea { font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: .4rem; padding: .5rem .6rem; width: 100%; }
label { display: flex; flex-direction: column; gap: .25rem; font-size: .875rem; color: var(--muted); }
label.vink { flex-direction: row; align-items: center; gap: .5rem; color: var(--ink); font-size: 1rem; }
label.vink input { width: auto; }

/* inloggen */
#login { min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
#login form { width: min(100%, 22rem); display: grid; gap: 1rem; background: var(--panel); border: 1px solid var(--line); border-radius: .75rem; padding: 2rem; }
.fout { color: var(--stop); font-size: .9rem; min-height: 1.3em; margin: 0; }

/* kop */
.top { border-bottom: 1px solid var(--line); background: var(--paper); position: sticky; top: 0; z-index: 3; }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1.5rem; padding-block: .7rem; }
.top .merk { font-family: var(--display); font-weight: 600; font-size: 1.2rem; letter-spacing: .08em; text-transform: uppercase; margin-right: auto; }
.tabs { display: flex; flex-wrap: wrap; gap: .25rem; }
.tabs button { background: transparent; color: var(--ink); border-color: transparent; padding: .35rem .8rem; }
.tabs button:hover { background: var(--panel); color: var(--ink); border-color: var(--line); }
.tabs button[aria-current="true"] { background: var(--ink); color: var(--paper); }
.teller { background: var(--orange); color: #fff; border-radius: 999px; padding: 0 .45rem; font-size: .8rem; margin-left: .35rem; }

main { padding-block: 1.75rem 4rem; display: grid; gap: 1.5rem; }
.kopregel { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .75rem; }
.leeg { color: var(--muted); background: var(--panel); border: 1px dashed var(--line); border-radius: .5rem; padding: 1.25rem; margin: 0; }
.uitleg { color: var(--muted); margin: 0; max-width: 44rem; }

/* aanvragen */
.kaarten { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 22rem), 1fr)); }
.kaart { border: 1px solid var(--line); border-left: 4px solid var(--orange); border-radius: .5rem; padding: 1rem 1.1rem; background: #fff; display: grid; gap: .5rem; min-width: 0; }
.kaart p { margin: 0; overflow-wrap: anywhere; }
.kaart .bericht { background: var(--panel); border-radius: .4rem; padding: .6rem .75rem; white-space: pre-wrap; font-size: .95rem; }
.acties { display: flex; flex-wrap: wrap; gap: .4rem; }
.klein-tekst { font-size: .875rem; color: var(--muted); }

/* tabellen */
.tabel { overflow-x: auto; border: 1px solid var(--line); border-radius: .5rem; background: #fff; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: .6rem .75rem; text-align: left; border-top: 1px solid var(--line); vertical-align: top; }
thead th { border-top: 0; font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 500; white-space: nowrap; }
td.bedrag, th.bedrag { text-align: right; white-space: nowrap; }
.pil { display: inline-block; border-radius: 999px; padding: .05rem .6rem; font-size: .8rem; white-space: nowrap; }
.pil.bevestigd { background: var(--gold-soft); } .pil.geblokkeerd { background: var(--grey); }
.pil.aangevraagd { background: #FBE3CD; } .pil.afgewezen, .pil.geannuleerd { background: #EFE9E0; color: var(--muted); }
.pil.betaald { background: var(--ok-soft); color: var(--ok); } .pil.open { background: #F6DDD9; color: var(--stop); }

/* agenda */
.maanden { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 1.25rem; }
.maand { border: 1px solid var(--line); border-radius: .5rem; padding: .75rem; background: #fff; }
.maand h3 { text-transform: capitalize; margin-bottom: .5rem; }
.dagen { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-size: .85rem; }
.dagen span { color: var(--muted); font-size: .7rem; padding-bottom: .2rem; }
.dagen button { border: 0; border-radius: .25rem; padding: .3rem 0; background: transparent; color: var(--ink); font-size: .85rem; }
.dagen button:hover { background: var(--panel); color: var(--ink); }
.dagen button.voorbij { color: var(--grey); }
.dagen button.bevestigd { background: var(--gold); color: #fff; }
.dagen button.geblokkeerd { background: var(--grey); color: var(--ink); }
.dagen button.aangevraagd { background: #FBE3CD; outline: 1px dashed var(--orange); outline-offset: -1px; }
.dagen button.nu { font-weight: 600; text-decoration: underline; }
.legenda { display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; font-size: .875rem; color: var(--muted); }
.legenda i { display: inline-block; width: .9rem; height: .9rem; border-radius: .2rem; vertical-align: -2px; margin-right: .35rem; }
.koppel { background: var(--panel); border: 1px solid var(--line); border-radius: .5rem; padding: 1rem; display: grid; gap: .5rem; }
.koppel code { overflow-wrap: anywhere; font-size: .85rem; user-select: all; }

.dk { border: 1px solid var(--gold); border-radius: .5rem; padding: .9rem; background: #fff; max-width: 22rem; }
.dk-kop { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: .6rem; }
.dagen button.kies { outline: 2px solid var(--orange); outline-offset: -2px; font-weight: 600; }

/* dialoog */
dialog { border: 1px solid var(--line); border-radius: .75rem; padding: 0; width: min(100% - 2rem, 34rem); color: var(--ink); background: var(--paper); }
dialog::backdrop { background: rgba(58, 35, 21, .45); }
dialog form { display: grid; gap: 1rem; padding: 1.5rem; }
.velden { display: grid; grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: .8rem; }
.velden .breed { grid-column: 1 / -1; }
.onder { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .5rem; }

/* factuur */
#factuurlaag { position: fixed; inset: 0; background: #fff; z-index: 10; overflow: auto; }
#factuurlaag .balk { display: flex; gap: .5rem; justify-content: flex-end; padding: .75rem 1rem; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: #fff; }
#factuur { max-width: 48rem; margin: 0 auto; padding: 2.5rem clamp(1rem, 5vw, 3rem); color: #222; }
#factuur h1 { font-size: 2.2rem; }
#factuur .twee { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-block: 2rem; }
#factuur p { margin: 0; white-space: pre-line; }
#factuur .label { font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: #777; margin-bottom: .25rem; }
#factuur table { margin-top: 1rem; }
#factuur th, #factuur td { border-top: 1px solid #ddd; padding-inline: 0; }
#factuur tfoot td { font-weight: 600; font-size: 1.1rem; border-top: 2px solid #222; }
#factuur .voet { margin-top: 2rem; display: grid; gap: .75rem; font-size: .95rem; }
@media print {
  body > :not(#factuurlaag) { display: none !important; }
  #factuurlaag { position: static; overflow: visible; }
  #factuurlaag .balk { display: none; }
  #factuur { padding: 0; max-width: none; }
}
</style>
</head>
<body>

<div id="login" hidden>
  <form id="loginform">
    <h1>Beheer</h1>
    <label for="wachtwoord">Wachtwoord
      <input type="password" id="wachtwoord" autocomplete="current-password" required>
    </label>
    <button type="submit">Inloggen</button>
    <p class="fout" id="loginfout" role="alert"></p>
  </form>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="wrap">
      <span class="merk">Casa Tinto de Verano</span>
      <nav class="tabs" id="tabs" aria-label="Onderdelen"></nav>
      <button type="button" class="licht klein" id="uitloggen">Uitloggen</button>
    </div>
  </header>
  <main class="wrap" id="view"></main>
</div>

<dialog id="dlg"></dialog>
<div id="factuurlaag" hidden>
  <div class="balk">
    <button type="button" id="afdrukken">Afdrukken of opslaan als pdf</button>
    <button type="button" class="licht" id="factuursluit">Sluiten</button>
  </div>
  <div id="factuur"></div>
</div>

<script type="module">
import { huurprijs, nachten, isDatum, SCHOONMAAK, BORG } from "../src/prijzen.js";

const $ = (s) => document.querySelector(s);
// Bouwt een element op zonder HTML-tekst, zodat invoer van bezoekers nooit als code wordt uitgevoerd.
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k in el && k !== "list" && k !== "form") el[k] = v;
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
  return el;
}
const euro = (n) => new Intl.NumberFormat("nl-NL", { style: "currency", currency: "EUR" }).format(n || 0);
const datum = (iso, lang) => new Intl.DateTimeFormat("nl-NL", { day: "numeric", month: lang ? "long" : "short", year: "numeric", timeZone: "UTC" }).format(new Date(iso + "T00:00:00Z"));
const periode = (b) => `${datum(b.aankomst)} t/m ${datum(b.vertrek)}`;
// "2 volwassenen, 1 kind (6 jaar)"; bij oudere boekingen alleen het aantal personen.
function gezelschap(b) {
  if (b.volwassenen == null && b.kinderen == null) return b.personen ? `${b.personen} personen` : "";
  const v = b.volwassenen || 0, k = b.kinderen || 0;
  let t = `${v} ${v === 1 ? "volwassene" : "volwassenen"}`;
  if (k) t += `, ${k} ${k === 1 ? "kind" : "kinderen"}` + (b.leeftijden ? ` (${b.leeftijden} jaar)` : "");
  else t += ", geen kinderen";
  return t;
}
// Datums typ je als dag-maand-jaar (04-07-2027); opgeslagen wordt jaar-maand-dag.
function leesDatum(tekst) {
  const m = /^\s*(\d{1,2})[-\/. ](\d{1,2})[-\/. ](\d{4})\s*$/.exec(tekst || "");
  if (!m) return "";
  const s = `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
  return isDatum(s) ? s : "";
}
const alsDatum = (s) => `${s.slice(8, 10)}-${s.slice(5, 7)}-${s.slice(0, 4)}`;
const totaal = (b) => (b.huur || 0) + (b.schoonmaak || 0);
const STATUS = { aangevraagd: "Aangevraagd", bevestigd: "Bevestigd", geblokkeerd: "Geblokkeerd", afgewezen: "Afgewezen", geannuleerd: "Geannuleerd" };

let D = null, tab = "aanvragen";

async function api(pad, method = "GET", body) {
  const r = await fetch("/api/" + pad, { method, headers: body ? { "content-type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && pad.startsWith("beheer/")) { toonLogin(); throw new Error("Je bent uitgelogd. Log opnieuw in."); }
  if (!r.ok) throw new Error(data.fout || "Er ging iets mis.");
  return data;
}
function toonLogin() { $("#app").hidden = true; $("#login").hidden = false; $("#wachtwoord").focus(); }
async function laad() {
  D = await api("beheer/overzicht");
  $("#login").hidden = true; $("#app").hidden = false;
  render();
}
async function doe(fn) {
  try { await fn(); await laad(); return true; } catch (e) { alert(e.message); return false; }
}

$("#loginform").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("#loginfout").textContent = "";
  try { await api("login", "POST", { wachtwoord: $("#wachtwoord").value }); $("#wachtwoord").value = ""; await laad(); }
  catch (err) { $("#loginfout").textContent = err.message; }
});
$("#uitloggen").addEventListener("click", async () => { await api("logout", "POST", {}); toonLogin(); });

// ---- Formulier in een dialoogvenster ----
function formulier(titel, velden, waarden, opslaan, extra) {
  const dlg = $("#dlg");
  const foutEl = h("p", { class: "fout", role: "alert" });
  const invoer = {};
  const rij = velden.map((v) => {
    let el;
    if (v.type === "select") el = h("select", { id: "f-" + v.naam }, v.opties.map(([w, t]) => h("option", { value: w }, t)));
    else if (v.type === "textarea") el = h("textarea", { id: "f-" + v.naam, rows: v.rijen || 3 });
    else if (v.type === "date") el = h("input", { id: "f-" + v.naam, type: "text", inputMode: "none", placeholder: "dd-mm-jjjj", maxLength: 10, autocomplete: "off" });
    else el = h("input", { id: "f-" + v.naam, type: v.type || "text", step: v.type === "number" ? (v.heel ? "1" : "0.01") : null, min: v.type === "number" ? "0" : null });
    if (v.type === "checkbox") el.checked = !!waarden[v.naam];
    else if (v.type === "date") el.value = waarden[v.naam] ? alsDatum(waarden[v.naam]) : "";
    else el.value = waarden[v.naam] ?? "";
    invoer[v.naam] = el;
    const lab = v.type === "checkbox" ? h("label", { class: "vink breed", for: el.id }, el, v.label) : h("label", { class: v.breed ? "breed" : "", for: el.id }, v.label, el);
    if (v.groep) lab.dataset.groep = v.groep;
    return lab;
  });
  const lees = () => Object.fromEntries(velden.map((v) => [v.naam, v.type === "checkbox" ? invoer[v.naam].checked : v.type === "date" ? leesDatum(invoer[v.naam].value) : invoer[v.naam].value]));
  const form = h("form", { onsubmit: async (e) => {
    e.preventDefault(); foutEl.textContent = "";
    try { await opslaan(lees()); dlg.close(); await laad(); } catch (err) { foutEl.textContent = err.message; }
  } },
    h("h2", null, titel),
    h("div", { class: "velden" }, rij),
    foutEl,
    h("div", { class: "onder" }, h("button", { type: "button", class: "licht", onclick: () => dlg.close() }, "Annuleren"), h("button", { type: "submit" }, "Opslaan")));
  dlg.replaceChildren(form);
  datumKiezer(form, invoer, velden);
  if (extra) extra(invoer, form);
  dlg.showModal();
}

// Uitklapkalender bij datumvelden: tik op het veld en kies een dag. Typen kan ook.
function datumKiezer(form, invoer, velden) {
  const datumVelden = velden.filter((v) => v.type === "date");
  if (!datumVelden.length) return;
  const paneel = h("div", { class: "dk", hidden: true });
  form.querySelector(".velden").after(paneel);
  const actief = D.boekingen.filter((b) => ["bevestigd", "geblokkeerd", "aangevraagd"].includes(b.status));
  let veld = null, jaar = 0, maand = 0;
  const blader = (stap) => { const d = new Date(Date.UTC(jaar, maand + stap, 1)); jaar = d.getUTCFullYear(); maand = d.getUTCMonth(); teken(); };
  function teken() {
    const eerste = new Date(Date.UTC(jaar, maand, 1)), dagen = new Date(Date.UTC(jaar, maand + 1, 0)).getUTCDate(), leeg = (eerste.getUTCDay() + 6) % 7;
    const gekozen = leesDatum(invoer[veld.naam].value);
    paneel.replaceChildren(
      h("div", { class: "dk-kop" }, h("strong", null, "Kies een dag: " + veld.label.toLowerCase()), h("button", { type: "button", class: "klein licht", onclick: () => { paneel.hidden = true; } }, "Sluiten")),
      h("div", { class: "dk-kop" },
        h("button", { type: "button", class: "klein licht", "aria-label": "Vorige maand", onclick: () => blader(-1) }, "‹"),
        h("strong", { style: "text-transform:capitalize" }, new Intl.DateTimeFormat("nl-NL", { month: "long", year: "numeric", timeZone: "UTC" }).format(eerste)),
        h("button", { type: "button", class: "klein licht", "aria-label": "Volgende maand", onclick: () => blader(1) }, "›")),
      h("div", { class: "dagen" }, ["ma", "di", "wo", "do", "vr", "za", "zo"].map((d) => h("span", null, d)), Array.from({ length: leeg }, () => h("i")),
        Array.from({ length: dagen }, (_, d) => {
          const iso = `${jaar}-${String(maand + 1).padStart(2, "0")}-${String(d + 1).padStart(2, "0")}`;
          const b = actief.find((x) => x.aankomst <= iso && iso < x.vertrek);
          return h("button", { type: "button", class: [b ? b.status : "", iso === gekozen ? "kies" : ""].join(" "), title: b ? `${STATUS[b.status]}: ${b.naam || b.notitie || ""}` : "Vrij",
            onclick: () => {
              invoer[veld.naam].value = alsDatum(iso);
              invoer[veld.naam].dispatchEvent(new Event("input", { bubbles: true }));
              const volgende = veld.naam === "aankomst" && datumVelden.find((v) => v.naam === "vertrek");
              if (volgende) open(volgende); else paneel.hidden = true;
            } }, String(d + 1));
        })));
  }
  function open(v) {
    veld = v;
    const basis = leesDatum(invoer[v.naam].value) || (v.naam === "vertrek" && invoer.aankomst && leesDatum(invoer.aankomst.value)) || D.vandaag;
    jaar = +basis.slice(0, 4); maand = +basis.slice(5, 7) - 1;
    paneel.hidden = false;
    teken();
  }
  for (const v of datumVelden) {
    invoer[v.naam].addEventListener("focus", () => open(v));
    invoer[v.naam].addEventListener("click", () => open(v));
  }
}

function boekingFormulier(b, nieuw) {
  const klantOpties = [["", "Nieuwe gast"]].concat(D.klanten.map((k) => [String(k.id), k.naam + (k.email ? ` (${k.email})` : "")]));
  const velden = [
    nieuw && { naam: "soort", label: "Wat wil je invoeren?", type: "select", opties: [["boeking", "Boeking van een gast"], ["blokkade", "Bezet zetten zonder gast"]], breed: true },
    { naam: "aankomst", label: "Aankomst", type: "date" },
    { naam: "vertrek", label: "Vertrek", type: "date" },
    nieuw && { naam: "klant_id", label: "Klant", type: "select", opties: klantOpties, breed: true, groep: "gast" },
    { naam: "naam", label: "Naam gast", groep: "gast nieuw" },
    { naam: "email", label: "E-mail", type: "email", groep: "gast nieuw" },
    { naam: "telefoon", label: "Telefoon", groep: "gast nieuw" },
    { naam: "volwassenen", label: "Volwassenen", type: "number", heel: true, groep: "gast" },
    { naam: "kinderen", label: "Kinderen", type: "number", heel: true, groep: "gast" },
    { naam: "leeftijden", label: "Leeftijd kinderen (bijv. 6, 9)", groep: "gast" },
    { naam: "huur", label: "Huur (€)", type: "number", groep: "gast" },
    { naam: "schoonmaak", label: "Eindschoonmaak (€)", type: "number", groep: "gast" },
    { naam: "borg", label: "Borg (€)", type: "number", groep: "gast" },
    !nieuw && { naam: "betaald", label: "Betaald", type: "checkbox", groep: "gast" },
    { naam: "notitie", label: "Notitie (alleen voor jou)", type: "textarea", breed: true }
  ].filter(Boolean);
  const blok = !nieuw && b.status === "geblokkeerd";
  formulier(nieuw ? "Nieuwe boeking of blokkade" : blok ? "Blokkade bewerken" : "Boeking bewerken", velden, b,
    (w) => nieuw ? api("beheer/boeking", "POST", w) : api("beheer/boeking/" + b.id, "PUT", w),
    (inv, form) => {
      let huurAangeraakt = !nieuw;
      const werk = () => {
        const isBlok = nieuw ? inv.soort.value === "blokkade" : blok;
        const bestaandeKlant = nieuw && inv.klant_id.value;
        form.querySelectorAll("[data-groep]").forEach((el) => {
